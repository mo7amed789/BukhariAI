<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A4D3B"/>
      <stop offset="50%" stop-color="#113327"/>
      <stop offset="100%" stop-color="#0A1E17"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#26785C" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#26785C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9E6B15"/>
    </linearGradient>
    <linearGradient id="goldSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E0"/>
      <stop offset="50%" stop-color="#F8D044"/>
      <stop offset="100%" stop-color="#D49818"/>
    </linearGradient>
    <linearGradient id="pageLeft" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E2D8C6"/>
      <stop offset="30%" stop-color="#FAF7EE"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="pageRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2D8C6"/>
      <stop offset="30%" stop-color="#FAF7EE"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#050C09" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="18" y="18" width="476" height="476" rx="110" fill="url(#bgGrad)"/>
  <rect x="18" y="18" width="476" height="476" rx="110" fill="url(#glowGrad)"/>

  <!-- Gold Borders -->
  <rect x="18" y="18" width="476" height="476" rx="110" fill="none" stroke="url(#goldGrad)" stroke-width="7"/>
  <rect x="30" y="30" width="452" height="452" rx="100" fill="none" stroke="#B48C30" stroke-width="1.8" stroke-opacity="0.5"/>

  <!-- Book Shadow & Backing -->
  <g filter="url(#dropShadow)">
    <path d="M 252 228 Q 156 205 53 220 L 53 363 Q 156 348 252 370 Z" fill="#0A1812"/>
    <path d="M 260 228 Q 356 205 459 220 L 459 363 Q 356 348 260 370 Z" fill="#0A1812"/>

    <!-- Left Open Page -->
    <path d="M 252 220 Q 156 197 61 212 L 61 348 Q 156 333 252 355 Z" fill="url(#pageLeft)" stroke="url(#goldGrad)" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Right Open Page -->
    <path d="M 260 220 Q 356 197 451 212 L 451 348 Q 356 333 260 355 Z" fill="url(#pageRight)" stroke="url(#goldGrad)" stroke-width="3" stroke-linejoin="round"/>

    <!-- Text Lines Left -->
    <path d="M 81 246 Q 146 236 208 240" stroke="#695C4E" stroke-width="5" stroke-linecap="round"/>
    <path d="M 81 272 Q 146 262 208 266" stroke="#695C4E" stroke-width="5" stroke-linecap="round"/>
    <path d="M 81 298 Q 146 288 208 292" stroke="#695C4E" stroke-width="5" stroke-linecap="round"/>
    <path d="M 111 324 Q 156 316 208 319" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>

    <!-- Text Lines Right -->
    <path d="M 304 240 Q 366 236 431 246" stroke="#695C4E" stroke-width="5" stroke-linecap="round"/>
    <path d="M 304 266 Q 366 262 431 272" stroke="#695C4E" stroke-width="5" stroke-linecap="round"/>
    <path d="M 304 292 Q 366 288 431 298" stroke="#695C4E" stroke-width="5" stroke-linecap="round"/>
    <path d="M 304 319 Q 356 316 401 324" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>

    <!-- Spine & Bookmark -->
    <line x1="256" y1="215" x2="256" y2="360" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round"/>
    <polygon points="242,357 270,357 270,408 256,393 242,408" fill="url(#goldSpark)" stroke="#A07319" stroke-width="2"/>
  </g>

  <!-- 8-Pointed Rub el Hizb Star -->
  <g transform="translate(256, 130)">
    <circle cx="0" cy="0" r="60" fill="#D4AF37" fill-opacity="0.2"/>
    <rect x="-35" y="-35" width="70" height="70" rx="9" fill="url(#goldSpark)" stroke="#FFFDF0" stroke-width="2.5"/>
    <rect x="-35" y="-35" width="70" height="70" rx="9" fill="url(#goldSpark)" stroke="#FFFDF0" stroke-width="2.5" transform="rotate(45)"/>
    <rect x="-24" y="-24" width="48" height="48" rx="6" fill="#D7A82A" stroke="#FFE890" stroke-width="1.5"/>
    <rect x="-24" y="-24" width="48" height="48" rx="6" fill="#D7A82A" stroke="#FFE890" stroke-width="1.5" transform="rotate(45)"/>
    <circle cx="0" cy="0" r="16" fill="#123428" stroke="#FFF5D0" stroke-width="2"/>
    <circle cx="0" cy="0" r="6.5" fill="#FFFFF0"/>
  </g>

  <!-- Sparks -->
  <g fill="url(#goldSpark)">
    <polygon points="151,142 153,130 157,142 169,144 157,146 153,158 151,146 139,144"/>
    <polygon points="361,142 363,130 367,142 379,144 367,146 363,158 361,146 349,144"/>
    <circle cx="191" cy="70" r="4.5"/>
    <circle cx="321" cy="70" r="4.5"/>
    <circle cx="256" cy="60" r="5.5"/>
  </g>
</svg>
