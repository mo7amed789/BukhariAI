services:
  bukhariapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bukhariai-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=BukhariAIDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-BukhariAI_P@ssw0rd2026};TrustServerCertificate=True;MultipleActiveResultSets=True;
      - Jwt__SecretKey=${JWT_SECRET_KEY:-BukhariAI_SuperSecret_Production_Ready_Key_MustBe32BytesLong!}
      - Jwt__Issuer=BukhariAI
      - Jwt__Audience=BukhariAIApp
      - AI__Provider=${AI_PROVIDER:-Gemini}
      - AI__Model=${AI_MODEL:-gemini-3.6-flash}
      - AI__ApiKey=${AI_API_KEY:-}
      - AI__FallbackApiKey=${AI_FALLBACK_API_KEY:-}
      - AI__FallbackEndpoint=https://conduit.ozdoev.net/v1/chat/completions
      - AI__FallbackModel=claude-sonnet-4-5
      - EnableSwagger=true
      - DisableHttpsRedirection=true
    depends_on:
      sqlserver:
        condition: service_healthy

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bukhariai-sql
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:-BukhariAI_P@ssw0rd2026}
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  mssql_data:
    driver: local
